<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ค้นหาบ้านเลขที่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#f6f7f9; --panel:#ffffff; --ink:#1d2742; --muted:#5d6782; --line:#d9dde7;
  --accent:#e0312b; --accent-soft:#e0312b22; --btn:#1d2742; --btn-ink:#ffffff; --mapbg:#eceef3;
  --sans:"IBM Plex Sans Thai",system-ui,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#12151d; --panel:#1a1f2b; --ink:#e7eaf2; --muted:#9aa3ba; --line:#2c3344;
    --accent:#ff4d45; --accent-soft:#ff4d4533; --btn:#e7eaf2; --btn-ink:#12151d; --mapbg:#0d1017;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#12151d; --panel:#1a1f2b; --ink:#e7eaf2; --muted:#9aa3ba; --line:#2c3344;
  --accent:#ff4d45; --accent-soft:#ff4d4533; --btn:#e7eaf2; --btn-ink:#12151d; --mapbg:#0d1017;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-direction:column;gap:6px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
form{display:flex;gap:8px;align-items:stretch;width:100%;max-width:460px}
.field{display:flex;align-items:center;flex:1;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding-left:12px;min-width:0}
.field:focus-within{border-color:var(--ink)}
.field b{font-family:var(--mono);font-weight:600;color:var(--muted);font-size:18px}
#q{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--mono);font-weight:600;font-size:18px;padding:10px 10px 10px 2px;outline:none}
button{font-family:var(--sans);cursor:pointer}
#go{border:0;border-radius:10px;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:16px;padding:0 20px}
#go:focus-visible,.ctl button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);min-height:22px}
.chip{font-family:var(--mono);font-weight:600;color:#fff;background:var(--accent);border-radius:99px;padding:1px 10px;font-size:14px}
.status.err{color:var(--accent)}

.view{flex:1;display:flex;min-height:0;position:relative}
main{position:relative;flex:1;overflow:hidden;background:var(--mapbg);touch-action:none;cursor:grab}
main.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;width:1230px;height:813px;transform-origin:0 0;will-change:transform}
#stage.anim{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
#stage img{display:block;width:1230px;height:813px;max-width:none;user-select:none;-webkit-user-drag:none;box-shadow:0 2px 14px #0002}
#stage svg{position:absolute;inset:0;overflow:visible}
.ring{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.6}
.pulse{fill:none;stroke:var(--accent);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
.tag rect{fill:var(--accent)}
.tag text{fill:#fff;font-family:var(--mono);font-weight:600;font-size:13px}
.ctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.ctl button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;line-height:1;box-shadow:0 1px 4px #0002}
.ctl button.fit{width:auto;min-width:40px;padding:0 6px;font-size:12px;font-weight:600}


@media (max-width:767px){
  header{padding:8px 12px}
  form{max-width:none}
  .ctl{display:none}
}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}#stage.anim{transition:none}}
</style>

const W=1230,HT=813;
const map=document.getElementById('map'),stage=document.getElementById('stage'),ov=document.getElementById('ov');
const q=document.getElementById('q'),st=document.getElementById('st');
let s=1,tx=0,ty=0,cur=0;
const small=()=>matchMedia('(max-width:767px)').matches;
function apply(anim){stage.classList.toggle('anim',!!anim);stage.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;if(cur)mark(cur);}
function pad(){return small()?{x:8,top:26,bot:8}:{x:24,top:48,bot:24};}
function fitScale(){const r=map.getBoundingClientRect(),p=pad();return Math.min((r.width-p.x)/W,(r.height-p.top-p.bot)/HT);}
function clampS(v){const f=fitScale();return Math.max(f*0.8,Math.min(v,Math.max(6,f*8)));}
function fit(anim){const r=map.getBoundingClientRect(),p=pad();s=fitScale();tx=(r.width-W*s)/2;ty=p.top+(r.height-p.top-p.bot-HT*s)/2;apply(anim);}
function zoomAt(cx,cy,ns,anim){ns=clampS(ns);tx=cx-(cx-tx)*ns/s;ty=cy-(cy-ty)*ns/s;s=ns;apply(anim);}

const NS='http://www.w3.org/2000/svg';

function marker(k,label){
